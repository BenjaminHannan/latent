name: Latent
options:
  bundleIdPrefix: com.benjaminhannan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # MARKETING_VERSION, CURRENT_PROJECT_VERSION, DEVELOPMENT_TEAM,
    # PRODUCT_BUNDLE_IDENTIFIER and API_BASE_URL come from Config/*.xcconfig.

targets:
  Latent:
    type: application
    platform: iOS
    sources:
      - path: Latent
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Latent/Info.plist
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

  LatentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LatentTests
        optional: true
    dependencies:
      - target: Latent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.benjaminhannan.latent.tests
        CODE_SIGN_STYLE: Automatic

schemes:
  Latent:
    build:
      targets:
        Latent: all
        LatentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LatentTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

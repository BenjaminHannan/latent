name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 16.x
        working-directory: .
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE" ]; then echo "No Xcode 16.x found; using default"; else sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          NAME="iPhone 16"
          if ! xcrun simctl list devices available | grep -q "^ *$NAME ("; then
            NAME="$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9A-Za-z ]+ \(' | sed 's/ ($//' | grep -v 'SE' | sort -V | tail -n 1)"
          fi
          if [ -z "$NAME" ]; then echo "No available iPhone simulator" >&2; exit 1; fi
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Latent.xcodeproj \
            -scheme Latent \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Latent.xcodeproj \
            -scheme Latent \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Latent.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Latent.xcresult
          path: ios/build/Latent.xcresult
          if-no-files-found: ignore

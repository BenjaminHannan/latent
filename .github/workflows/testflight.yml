name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub secrets::Add these repository secrets (Settings > Secrets and variables > Actions):$missing. See docs/TESTFLIGHT.md."
            exit 1
          fi

      - name: Select latest Xcode 16.x
        working-directory: .
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE" ]; then echo "No Xcode 16.x found; using default"; else sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Latent-ipa
          path: |
            ios/build/*.ipa
            ios/build/*.dSYM.zip
          if-no-files-found: ignore
